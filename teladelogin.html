<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Resonanse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            border: none;
            border-radius: 18px;
        }

        .btn-resonanse {
            background: #212529;
            color: white;
            padding: 11px;
            border-radius: 8px;
        }

        .btn-resonanse:hover {
            background: #343a40;
            color: white;
        }

        .alternar {
            color: #212529;
            font-weight: 600;
            text-decoration: none;
        }

        .alternar:hover {
            text-decoration: underline;
        }

        .form-control {
            padding: 11px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-2">Resonanse</h2>
                <p class="text-center text-muted mb-4">Entre na sua conta</p>

                <div id="mensagem" class="alert d-none"></div>

                <form id="formLogin">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" name="senha" required>
                    </div>

                    <button type="submit" class="btn btn-resonanse w-100">
                        Entrar
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Ainda não tem uma conta?
                    <a href="/cadastro" class="alternar">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        const mensagem = document.getElementById('mensagem');

        function mostrarMensagem(texto) {
            mensagem.textContent = texto;
            mensagem.className = 'alert alert-danger';
        }

        function traduzirErro(erro) {
            const texto = String(erro || '');

            if (texto.includes('Email not confirmed')) {
                return 'Sua conta ainda não teve o email confirmado.';
            }

            if (texto.includes('Invalid login credentials')) {
                return 'Email ou senha incorretos.';
            }

            return texto || 'Ocorreu um erro inesperado.';
        }

        formLogin.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            mensagem.className = 'alert d-none';

            const botao = formLogin.querySelector('button');
            botao.disabled = true;
            botao.textContent = 'Entrando...';

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams(new FormData(formLogin))
                });

                const dados = await resposta.json();

                if (!resposta.ok || !dados.sucesso) {
                    throw new Error(traduzirErro(dados.erro));
                }

                window.location.href = '/';
            } catch (erro) {
                mostrarMensagem(erro.message);
            } finally {
                botao.disabled = false;
                botao.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
