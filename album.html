
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Álbum | Resonanse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar-container"></div>

<main class="container mt-5">
    <div id="detalhes">
        <p>Carregando álbum...</p>
    </div>

    <h2 class="mt-5 mb-4">Informações</h2>
    <div id="informacoes"></div>
</main>

<script>
const albumId = new URLSearchParams(window.location.search).get('id');

async function carregarAlbum() {
    const detalhes = document.getElementById('detalhes');
    const informacoes = document.getElementById('informacoes');

    if (!albumId) {
        detalhes.innerHTML = '<p>Nenhum álbum selecionado.</p>';
        return;
    }

    try {
        const resposta = await fetch(`/api/lancamentos/${albumId}`);

        if (!resposta.ok) throw new Error();

        const album = await resposta.json();

        const artistas = album['artist-credit']?.map(a => a.name || a.artist?.name).join(', ') || 'Artista desconhecido';
        const ano = album['first-release-date']?.substring(0, 4) || 'Não informado';
        const tipo = album['primary-type'] || 'Não informado';
        const capa = `https://coverartarchive.org/release-group/${album.id}/front-500`;

        detalhes.innerHTML = `
            <div class="row g-4 align-items-start">
                <div class="col-md-4">
                    <img src="${capa}" class="img-fluid rounded" alt="${album.title}"
                         onerror="this.style.display='none'">
                </div>

                <div class="col-md-8">
                    <h1>${album.title}</h1>
                    <h4>${artistas}</h4>
                    <p><strong>Ano:</strong> ${ano}</p>
                    <p><strong>Tipo:</strong> ${tipo}</p>
                    <p><strong>Avaliação:</strong> Sem avaliações</p>
                </div>
            </div>
        `;

        informacoes.innerHTML = `
            <p><strong>Artista:</strong> ${artistas}</p>
            <p><strong>Data de lançamento:</strong> ${album['first-release-date'] || 'Não informada'}</p>
            <p><strong>Gêneros:</strong> ${(album.tags || []).map(tag => tag.name).join(', ') || 'Não informado'}</p>
            <a href="/artista.html?id=${album['artist-credit']?.[0]?.artist?.id || ''}" class="btn btn-primary">
                Ver artista
            </a>
        `;
    } catch (erro) {
        detalhes.innerHTML = '<p>Não foi possível carregar este álbum.</p>';
    }
}

document.getElementById('formBusca').addEventListener('submit', event => {
    event.preventDefault();

    const termo = document.getElementById('pesquisa').value.trim();

    if (termo) {
        window.location.href = `/exebicaodealbum.html?q=${encodeURIComponent(termo)}`;
    }
});

carregarAlbum();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/navbar.js"></script>
</body>
</html>
