
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Singles | Resonanse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card-single {
            height: 100%;
            transition: transform 0.2s;
            border: none;
        }

        .card-single:hover {
            transform: translateY(-5px);
        }

        .card-single img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .nota-card {
            font-size: 0.9rem;
            color: #198754;
        }

        .nome-artista {
            color: #198754;
            text-decoration: none;
        }

        .nome-artista:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div id="navbar-container"></div>

<main class="container mt-5">
    <h2 class="mb-4">Singles</h2>

    <div id="listaSingles" class="row g-4">
        <p>Carregando singles...</p>
    </div>
</main>

<div class="modal fade" id="modalAvaliacao" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Avaliar single</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                <p class="text-muted">Escolha uma nota entre 0 e 10.</p>

                <select id="notaSelecionada" class="form-select text-center fs-4">
                    <option value="">Selecione sua nota</option>
                    <option value="0">0</option>
                    <option value="0.5">0,5</option>
                    <option value="1">1</option>
                    <option value="1.5">1,5</option>
                    <option value="2">2</option>
                    <option value="2.5">2,5</option>
                    <option value="3">3</option>
                    <option value="3.5">3,5</option>
                    <option value="4">4</option>
                    <option value="4.5">4,5</option>
                    <option value="5">5</option>
                    <option value="5.5">5,5</option>
                    <option value="6">6</option>
                    <option value="6.5">6,5</option>
                    <option value="7">7</option>
                    <option value="7.5">7,5</option>
                    <option value="8">8</option>
                    <option value="8.5">8,5</option>
                    <option value="9">9</option>
                    <option value="9.5">9,5</option>
                    <option value="10">10</option>
                </select>

                <p id="mensagemAvaliacao" class="mt-3 mb-0"></p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button" class="btn btn-primary" id="enviarAvaliacao">
                    Enviar avaliação
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let singleSelecionado = null;

const modalAvaliacao = new bootstrap.Modal(
    document.getElementById('modalAvaliacao')
);

function escapar(texto) {
    return String(texto ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    })[caractere]);
}

async function buscarAPI(url, opcoes = {}) {
    const resposta = await fetch(url, opcoes);
    const dados = await resposta.json();

    if (!resposta.ok) {
        throw new Error(
            dados.erro || dados.error || 'Não foi possível completar a solicitação.'
        );
    }

    return dados;
}

async function carregarNota(elemento, id) {
    try {
        const dados = await buscarAPI(
            `/api/avaliacoes/single/${encodeURIComponent(id)}`
        );

        if (dados.quantidade > 0) {
            elemento.textContent =
                `★ ${Number(dados.media).toFixed(1)}/10 (${dados.quantidade} avaliações)`;
        } else {
            elemento.textContent = 'Ainda sem avaliações';
        }
    } catch (erro) {
        elemento.textContent = 'Não foi possível carregar a nota';
    }
}

function criarCardSingle(single) {
    const id = single.id;

    const capa = single.cover_xl ||
        single.cover_big ||
        single.cover_medium ||
        single.cover_url ||
        'https://placehold.co/300x300?text=Sem+capa';

    const artista = single.artist?.name ||
        single.artist_name ||
        'Artista desconhecido';

    const idArtista = single.artist?.id || single.artist_id;

    const coluna = document.createElement('div');
    coluna.className = 'col-12 col-sm-6 col-md-4 col-lg-3';

    coluna.innerHTML = `
        <div class="card card-single shadow-sm">
            <img
                src="${escapar(capa)}"
                class="card-img-top"
                alt="Capa de ${escapar(single.title || 'single')}"
                onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=Sem+capa'"
            >

            <div class="card-body d-flex flex-column">
                <h5 class="card-title">
                    ${escapar(single.title || 'Single sem título')}
                </h5>

                <p class="card-text">
                    ${idArtista ? `
                        <a href="/artista?id=${encodeURIComponent(idArtista)}"
                           class="nome-artista">
                            ${escapar(artista)}
                        </a>
                    ` : escapar(artista)}
                </p>

                <p class="nota-card mb-3 nota-single">
                    Carregando nota...
                </p>

                <a href="/album?id=${encodeURIComponent(id)}"
                   class="btn btn-outline-success mb-2">
                    Ver single
                </a>

                <button class="btn btn-success mt-auto" type="button">
                    Avaliar
                </button>
            </div>
        </div>
    `;

    coluna.querySelector('button').addEventListener('click', () => {
        singleSelecionado = id;

        document.getElementById('tituloModal').textContent =
            `Avaliar ${single.title || 'single'}`;

        document.getElementById('notaSelecionada').value = '';
        document.getElementById('mensagemAvaliacao').textContent = '';

        modalAvaliacao.show();
    });

    carregarNota(coluna.querySelector('.nota-single'), id);

    return coluna;
}

async function carregarSingles() {
    const lista = document.getElementById('listaSingles');

    try {
        const dados = await buscarAPI(
            '/api/catalogo?tipo=single&limit=100'
        );

        const singles = Array.isArray(dados)
            ? dados
            : dados.data || dados.lancamentos || [];

        lista.innerHTML = '';

        if (singles.length === 0) {
            lista.innerHTML = `
                <p class="text-muted">Nenhum single encontrado.</p>
            `;
            return;
        }

        singles.forEach(single => {
            lista.appendChild(criarCardSingle(single));
        });
    } catch (erro) {
        lista.innerHTML = `
            <div class="alert alert-danger">
                Não foi possível carregar os singles: ${escapar(erro.message)}
            </div>
        `;

        console.error(erro);
    }
}

document.getElementById('enviarAvaliacao').addEventListener('click', async () => {
    const nota = document.getElementById('notaSelecionada').value;
    const mensagem = document.getElementById('mensagemAvaliacao');
    const botao = document.getElementById('enviarAvaliacao');

    if (nota === '') {
        mensagem.textContent = 'Selecione uma nota.';
        mensagem.className = 'mt-3 text-danger';
        return;
    }

    botao.disabled = true;
    mensagem.textContent = 'Salvando avaliação...';
    mensagem.className = 'mt-3 text-muted';

    try {
        await buscarAPI('/api/avaliacoes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                tipo: 'single',
                itemId: String(singleSelecionado),
                nota: Number(nota)
            })
        });

        mensagem.textContent = 'Avaliação enviada com sucesso!';
        mensagem.className = 'mt-3 text-success';

        const elementoNota = document.querySelector('.nota-single');

        if (elementoNota && singleSelecionado) {
            const card = [...document.querySelectorAll('.card-single')]
                .find(elemento => {
                    const link = elemento.querySelector('a[href^="/album?id="]');
                    return link && new URL(link.href).searchParams.get('id') === String(singleSelecionado);
                });

            if (card) {
                await carregarNota(
                    card.querySelector('.nota-single'),
                    singleSelecionado
                );
            }
        }

        setTimeout(() => modalAvaliacao.hide(), 800);
    } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.className = 'mt-3 text-danger';
    } finally {
        botao.disabled = false;
    }
});

carregarSingles();
</script>

<script src="/navbar.js"></script>

</body>
</html>
