
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resonanse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .secao {
            margin-bottom: 55px;
        }

        .card {
            border: none;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .capa {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #e9ecef;
        }

        .artista-card,
        .genero-card {
            min-height: 150px;
        }

        .titulo-secao {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .nota-card {
            color: #198754;
            font-size: 0.875rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<main class="container mt-5">
    <section class="mb-5">
        <h1>Resonanse</h1>
        <p>Descubra artistas, conheça novos lançamentos e avalie suas músicas favoritas.</p>

        <form id="formPesquisa" class="row g-2 mt-4">
            <div class="col-md-7">
                <input
                    type="search"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Pesquise artistas, álbuns ou singles"
                    required
                >
            </div>

            <div class="col-md-3">
                <select id="tipoPesquisa" class="form-select">
                    <option value="todos">Todos</option>
                    <option value="artistas">Artistas</option>
                    <option value="album">Álbuns</option>
                    <option value="single">Singles</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">
                    Pesquisar
                </button>
            </div>
        </form>

        <div id="mensagemPesquisa" class="mt-3"></div>
        <div id="resultadosPesquisa" class="row g-4 mt-2"></div>
    </section>

    <section class="secao">
        <h2 class="titulo-secao">Lançamentos</h2>
        <div id="lancamentos" class="row g-4">
            <p>Carregando lançamentos...</p>
        </div>
        <button id="maisLancamentos" class="btn btn-outline-success mt-4">
            Carregar mais lançamentos
        </button>
    </section>

    <section class="secao">
        <h2 class="titulo-secao">Artistas</h2>
        <div id="artistas" class="row g-4">
            <p>Carregando artistas...</p>
        </div>
        <button id="maisArtistas" class="btn btn-outline-success mt-4">
            Carregar mais artistas
        </button>
    </section>

    <section class="secao">
        <h2 class="titulo-secao">Gêneros musicais</h2>
        <div id="generos" class="row g-3">
            <p>Carregando gêneros...</p>
        </div>
    </section>

    <section id="secaoGenero" class="secao" style="display: none;">
        <h2 id="tituloGenero" class="titulo-secao"></h2>
        <div id="resultadosGenero" class="row g-4"></div>
    </section>
</main>

<script>
const lancamentos = document.getElementById('lancamentos');
const artistas = document.getElementById('artistas');
const generos = document.getElementById('generos');

const estado = {
    lancamentos: 0,
    artistas: 0,
    limite: 12
};

function escapar(texto) {
    return String(texto ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    })[caractere]);
}

async function buscarAPI(url) {
    const resposta = await fetch(url);
    const dados = await resposta.json();

    if (!resposta.ok) {
        throw new Error(dados.erro || 'Erro ao consultar a API.');
    }

    return dados;
}

async function carregarNota(elemento, tipo, id) {
    try {
        const dados = await buscarAPI(
            `/api/avaliacoes/${tipo}/${encodeURIComponent(id)}`
        );

        elemento.textContent =
            dados.media !== null && dados.media !== undefined
                ? `★ ${Number(dados.media).toFixed(1)} (${dados.quantidade})`
                : 'Ainda sem avaliações';

    } catch (erro) {
        elemento.textContent = 'Avaliação indisponível';
    }
}

function obterTipoLancamento(item) {
    const tipo = String(
        item.record_type || item['primary-type'] || ''
    ).toLowerCase();

    return tipo === 'single' || item.album ? 'single' : 'album';
}

function criarCardLancamento(item) {
    const artista = item.artist || item.album?.artist || {};

    const nomeArtista = artista.name || 'Artista não informado';
    const idArtista = artista.id;

    const imagem = item.cover_xl ||
        item.cover_big ||
        item.cover_url ||
        item.album?.cover_xl ||
        item.album?.cover_big ||
        item.album?.cover_medium ||
        'https://placehold.co/300x300?text=Sem+capa';

    const data = item.release_date ||
        item.album?.release_date ||
        item.date;

    const tipo = obterTipoLancamento(item);
    const idDetalhes = item.album?.id || item.id;

    const card = document.createElement('div');
    card.className = 'col-6 col-md-4 col-lg-2';

    card.innerHTML = `
        <div class="card h-100 shadow-sm">
            <img src="${escapar(imagem)}"
                class="card-img-top capa"
                alt="Capa de ${escapar(item.title)}"
                onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=Sem+capa'">

            <div class="card-body">
                <h6 class="card-title">${escapar(item.title)}</h6>

                <p class="card-text small">
                    ${idArtista
                        ? `<a href="/artista?id=${encodeURIComponent(idArtista)}"
                            class="text-success text-decoration-none">
                            ${escapar(nomeArtista)}
                           </a>`
                        : escapar(nomeArtista)}
                </p>

                <p class="text-muted small">
                    ${tipo === 'single' ? 'Single' : 'Álbum'}
                    ${data ? ' • ' + escapar(data.substring(0, 4)) : ''}
                </p>

                <p class="nota-card nota-lancamento mb-2">
                    Carregando avaliação...
                </p>

                <a href="/album?id=${encodeURIComponent(idDetalhes)}"
                    class="btn btn-sm btn-outline-success mt-2">
                    Ver detalhes
                </a>
            </div>
        </div>
    `;

    carregarNota(
        card.querySelector('.nota-lancamento'),
        tipo,
        idDetalhes
    );

    return card;
}

function criarCardArtista(artista) {
    const card = document.createElement('div');
    card.className = 'col-6 col-md-4 col-lg-2';

    const imagem = artista.picture_medium ||
        artista.picture_big ||
        'https://placehold.co/300x300?text=Artista';

    card.innerHTML = `
        <div class="card artista-card h-100 shadow-sm">
            <img src="${escapar(imagem)}"
                class="card-img-top capa"
                alt="${escapar(artista.name)}"
                onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=Artista'">

            <div class="card-body">
                <h5 class="card-title">
                    ${escapar(artista.name)}
                </h5>

                <p class="small text-muted">
                    ${Number(artista.nb_fan || 0).toLocaleString('pt-BR')} fãs
                </p>

                <p class="nota-card nota-artista mb-2">
                    Carregando avaliação...
                </p>

                <a href="/artista?id=${encodeURIComponent(artista.id)}"
                    class="btn btn-sm btn-outline-success">
                    Ver artista
                </a>
            </div>
        </div>
    `;

    carregarNota(
        card.querySelector('.nota-artista'),
        'artista',
        artista.id
    );

    return card;
}

function criarCardGenero(genero) {
    const card = document.createElement('div');
    card.className = 'col-6 col-md-3 col-lg-2';

    card.innerHTML = `
        <button
            class="card genero-card shadow-sm text-dark w-100"
            type="button"
        >
            <div class="card-body d-flex align-items-center justify-content-center">
                <h5 class="text-center mb-0">
                    ${escapar(genero.name)}
                </h5>
            </div>
        </button>
    `;

    card.querySelector('button').addEventListener('click', () => {
        carregarLancamentosGenero(genero.name);
    });

    return card;
}

async function carregarLancamentos() {
    const botao = document.getElementById('maisLancamentos');
    const offset = estado.lancamentos;

    botao.disabled = true;

    try {
        const [dadosAlbuns, dadosSingles] = await Promise.all([
            buscarAPI(`/api/catalogo?tipo=album&limit=${estado.limite}&offset=${offset}`),
            buscarAPI(`/api/catalogo?tipo=single&limit=${estado.limite}&offset=${offset}`)
        ]);

        const listaAlbuns = dadosAlbuns.data || [];
        const listaSingles = dadosSingles.data || [];

        const lista = [...listaAlbuns, ...listaSingles];

        lista.sort(() => Math.random() - 0.5);

        if (offset === 0) {
            lancamentos.innerHTML = '';
        }

        lista.forEach(item => {
            lancamentos.appendChild(criarCardLancamento(item));
        });

        estado.lancamentos += estado.limite;

        const total = (dadosAlbuns.total || 0) + (dadosSingles.total || 0);

        botao.style.display =
            estado.lancamentos >= total ? 'none' : 'block';

        if (!lista.length && offset === 0) {
            lancamentos.innerHTML = '<p>Nenhum lançamento encontrado.</p>';
        }

    } catch (erro) {
        lancamentos.innerHTML = `<p>${escapar(erro.message)}</p>`;
    } finally {
        botao.disabled = false;
    }
}

async function carregarArtistas() {
    const botao = document.getElementById('maisArtistas');

    botao.disabled = true;

    try {
        const dados = await buscarAPI(
            `/api/artistas?limit=${estado.limite}&offset=${estado.artistas}`
        );

        const lista = dados.data || [];

        if (estado.artistas === 0) {
            artistas.innerHTML = '';
        }

        lista.forEach(artista => {
            artistas.appendChild(criarCardArtista(artista));
        });

        estado.artistas += lista.length;

        botao.style.display =
            estado.artistas >= (dados.total || 0) ? 'none' : 'block';

        if (!lista.length && estado.artistas === 0) {
            artistas.innerHTML = '<p>Nenhum artista encontrado.</p>';
        }

    } catch (erro) {
        artistas.innerHTML = `<p>${escapar(erro.message)}</p>`;
    } finally {
        botao.disabled = false;
    }
}

async function carregarGeneros() {
    try {
        const dados = await buscarAPI('/api/generos?limit=100');

        const lista = dados.data || [];

        generos.innerHTML = '';

        lista.forEach(genero => {
            generos.appendChild(criarCardGenero(genero));
        });

        if (!lista.length) {
            generos.innerHTML = '<p>Nenhum gênero encontrado.</p>';
        }

    } catch (erro) {
        generos.innerHTML = `<p>${escapar(erro.message)}</p>`;
    }
}

async function carregarLancamentosGenero(genero) {
    const secao = document.getElementById('secaoGenero');
    const titulo = document.getElementById('tituloGenero');
    const resultados = document.getElementById('resultadosGenero');

    secao.style.display = 'block';
    titulo.textContent = `Lançamentos de ${genero}`;
    resultados.innerHTML = '<p>Carregando lançamentos...</p>';

    secao.scrollIntoView({ behavior: 'smooth' });

    try {
        const dados = await buscarAPI(
            `/api/generos/${encodeURIComponent(genero)}/lancamentos?tipo=todos&limit=12`
        );

        const lista = dados.data || [];

        resultados.innerHTML = '';

        lista.forEach(item => {
            resultados.appendChild(criarCardLancamento(item));
        });

        if (!lista.length) {
            resultados.innerHTML =
                '<p>Nenhum lançamento encontrado para esse gênero.</p>';
        }

    } catch (erro) {
        resultados.innerHTML = `<p>${escapar(erro.message)}</p>`;
    }
}

document.getElementById('maisLancamentos').addEventListener('click', carregarLancamentos);

document.getElementById('maisArtistas').addEventListener('click', carregarArtistas);

document.getElementById('formPesquisa').addEventListener('submit', async evento => {
    evento.preventDefault();

    const termo = document.getElementById('pesquisa').value.trim();
    const filtro = document.getElementById('tipoPesquisa').value;

    const resultados = document.getElementById('resultadosPesquisa');
    const mensagem = document.getElementById('mensagemPesquisa');

    resultados.innerHTML = '';
    mensagem.textContent = 'Pesquisando...';

    try {
        let quantidade = 0;

        if (filtro === 'artistas' || filtro === 'todos') {
            const dados = await buscarAPI(
                `/api/artistas?q=${encodeURIComponent(termo)}&limit=12`
            );

            (dados.data || []).forEach(item => {
                resultados.appendChild(criarCardArtista(item));
                quantidade++;
            });
        }

        if (filtro !== 'artistas') {
            const dados = await buscarAPI(
                `/api/lancamentos?q=${encodeURIComponent(termo)}&tipo=${filtro}&limit=12`
            );

            (dados.data || []).forEach(item => {
                resultados.appendChild(criarCardLancamento(item));
                quantidade++;
            });
        }

        mensagem.textContent = quantidade
            ? `${quantidade} resultado(s) encontrado(s).`
            : 'Nenhum resultado encontrado.';

    } catch (erro) {
        mensagem.textContent = erro.message;
    }
});

async function carregarPaginaInicial() {
    await Promise.all([
        carregarLancamentos(),
        carregarArtistas(),
        carregarGeneros()
    ]);
}

carregarPaginaInicial();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
